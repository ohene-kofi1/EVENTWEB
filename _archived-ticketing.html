              <sc-if value="{{ sheet.needsPay }}" hint-placeholder-val="{{ true }}">

                      <button onClick="{{ m.select }}" style="{{ m.style }}">
                        <span style="display:block;font-size:13.5px;font-weight:700">{{ m.label }}</span>
                        <span style="display:block;font-size:11.5px;color:#6c717c;margin-top:3px">{{ m.note }}</span>
                      </button>

                  </div>
                </div>
              </sc-if>

              <div style="margin-top:auto;border-top:1px solid #e8e9ed;padding-top:18px">

                  <span>{{ sheet.subLabel }}</span><span class="num">{{ sheet.subTotal }}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:13.5px;color:#6c717c;margin-top:7px">
